spring:
  main:
    web-application-type: servlet
  application:
    name: job-sprout-resume
  config:
    import:
      - optional:nacos:job-sprout-resume?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:job-sprout-common?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yaml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/job_sprout?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 职芽简历与投递服务
    description: 简历管理、职位投递及企业处理接口
    version: 1.0.0
